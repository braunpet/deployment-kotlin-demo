name: Build and test

# Trigger: every push and every pull request; can also be started by hand in the "Actions" tab
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run the tests
        run: ./gradlew build

      - name: Keep the test report
        if: always()   # also upload the report when a test failed
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/

      - name: Keep the built JAR
        uses: actions/upload-artifact@v4
        with:
          name: demo-jar
          path: build/libs/*.jar
